server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that is not a file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets, no cache for the HTML shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The backend, same origin: the frontend is built with VITE_BACKEND_URL=/api in compose,
    # so /api/health reaches the backend container as /health and no CORS is involved.
    # Audio uploads can be large (50 MB per file) and analysis can take a while.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 60m;
        proxy_read_timeout 300s;
    }
}
