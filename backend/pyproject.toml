[project]
name = "riffspaced"
version = "0.0.0"
description = "RIFF-SPACED backend: audio analysis of low-tuned guitar riffs and the Claude AI layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ridley DiSiena (SPACED)" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "jsonschema>=4.23",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "httpx>=0.27",
  "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riffspaced"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes and pycodestyle, I: import order, B: bugbear, UP: modern syntax,
# N: naming, D: docstrings (public API only, see per-file ignores and pydocstyle config).
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = [
  "D100", # module docstring not required
  "D104", # package docstring not required
  "D105", # magic method docstring not required
  "D107", # __init__ docstring not required
  "D203", # one blank line before class docstring (conflicts with D211)
  "D213", # summary on second line (we use D212, summary on first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
